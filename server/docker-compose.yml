services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: secureline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: secureline_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  signal-server:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      SECURELINE_SERVER_PORT: "8080"
      SECURELINE_DATABASE_URL: "jdbc:postgresql://postgres:5432/secureline_db"
      SECURELINE_DATABASE_USERNAME: secureline
      SECURELINE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      SECURELINE_REDIS_URL: "redis://redis:6379"
      SECURELINE_ZK_SECRET: ${SECURELINE_ZK_SECRET:?Set SECURELINE_ZK_SECRET in the environment}
    ports:
      - "8080:8080"

volumes:
  pgdata:
