name: Docker Build

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'

jobs:
  build-server:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: |
        cd server
        docker-compose build

    - name: Run tests
      run: |
        cd server
        docker-compose up -d postgres redis
        sleep 10
        docker-compose up -d signal-server
        sleep 30
        curl -s http://localhost:8080/health
